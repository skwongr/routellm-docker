version: '3.8'

services:
  routellm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routellm-server
    ports:
      - "6060:6060"
    environment:
      - STRONG_MODEL=${STRONG_MODEL:-ollama_chat/llama3}
      - WEAK_MODEL=${WEAK_MODEL:-ollama_chat/phi3}
      - API_BASE=${API_BASE:-http://host.docker.internal:11434/v1}
      - API_KEY=${API_KEY:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-nokey}
    env_file:
      - .env
    volumes:
      - ./cache:/root/.cache
    restart: unless-stopped